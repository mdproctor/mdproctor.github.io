    <text xml:space="preserve" class="term-text" style="fill: #cccccc">
      <tspan y="0.0">
        <tspan dy="1em" x="0.0">$ # let&#39;s try some FEEL expressions...                                          </tspan>
      </tspan><tspan y="18.666662000000002">
        <tspan dy="1em" x="0.0">$ jbang feel@kiegroup &#39;1+2&#39;                                                     </tspan>
      </tspan><tspan y="37.333324000000005">
        <tspan dy="1em" x="0.0">3                                                                               </tspan>
      </tspan><tspan y="55.99998600000001">
        <tspan dy="1em" x="0.0">$ # it can be very helpful to quickly check some FEEL syntax, or semantics...   </tspan>
      </tspan><tspan y="74.66664800000001">
        <tspan dy="1em" x="0.0">$ jbang feel@kiegroup &#39;if 2&gt;1 then true&#39;                                        </tspan>
      </tspan><tspan y="93.33331000000001">
        <tspan dy="1em" x="0.0">[main] ERROR CliFeelListener - Detected &#39;if&#39; expression without &#39;else&#39; part (nea</tspan>
      </tspan><tspan y="111.99997200000001">
        <tspan dy="1em" x="0.0">r: &lt;EOF&gt;) [mismatched input &#39;&lt;EOF&gt;&#39; expecting {&#39;in&#39;, &#39;else&#39;, &#39;instance&#39;, &#39;or&#39;, &#39;</tspan>
      </tspan><tspan y="130.66663400000002">
        <tspan dy="1em" x="0.0">and&#39;, &#39;between&#39;, &#39;(&#39;, &#39;[&#39;, &#39;.&#39;, &#39;=&#39;, &#39;&gt;&#39;, &#39;&lt;&#39;, &#39;&lt;=&#39;, &#39;&gt;=&#39;, &#39;!=&#39;, &#39;**&#39;, &#39;+&#39;, &#39;-&#39;,</tspan>
      </tspan><tspan y="149.33329600000002">
        <tspan dy="1em" x="0.0"> &#39;*&#39;, &#39;/&#39;}]                                                                     </tspan>
      </tspan><tspan y="167.99995800000002">
        <tspan dy="1em" x="0.0">true                                                                            </tspan>
      </tspan><tspan y="186.66662000000002">
        <tspan dy="1em" x="0.0">$ # we missed the `else` part !                                                 </tspan>
      </tspan><tspan y="205.33328200000003">
        <tspan dy="1em" x="0.0">$ jbang feel@kiegroup &#39;if 2&gt;1 then true else false&#39;                             </tspan>
      </tspan><tspan y="223.99994400000003">
        <tspan dy="1em" x="0.0">true                                                                            </tspan>
