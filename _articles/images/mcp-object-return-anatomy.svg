<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320">
  <defs>
    <style>
      text { font-family: -apple-system, 'Segoe UI', sans-serif; }
      .heading { font-size: 15px; font-weight: 600; fill: #111827; }
      .code { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 12px; }
      .label { font-size: 12px; fill: #6b7280; }
      .box { stroke-width: 1.5; rx: 6; }
    </style>
  </defs>

  <!-- Title -->
  <text x="360" y="24" text-anchor="middle" class="heading">The Object Return Problem</text>

  <!-- Left: Resource (has the type) -->
  <rect x="30" y="50" width="300" height="120" class="box" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="180" y="72" text-anchor="middle" font-size="13" font-weight="600" fill="#16a34a">Resource (has the type)</text>
  <text x="50" y="100" class="code" fill="#374151">public List&lt;OrderEntity&gt; listAll() {</text>
  <text x="50" y="118" class="code" fill="#374151">    return repo.findAll();</text>
  <text x="50" y="136" class="code" fill="#374151">}</text>
  <text x="50" y="158" class="label">Agent never sees this — REST only</text>

  <!-- Arrow -->
  <line x1="340" y1="110" x2="380" y2="110" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="360" y="100" text-anchor="middle" class="label">wraps</text>

  <!-- Right: API (erases the type) -->
  <rect x="390" y="50" width="300" height="120" class="box" fill="#fef2f2" stroke="#dc2626"/>
  <text x="540" y="72" text-anchor="middle" font-size="13" font-weight="600" fill="#dc2626">@McpDomain API (erases it)</text>
  <text x="410" y="100" class="code" fill="#374151">public Object listAll() {</text>
  <text x="410" y="118" class="code" fill="#374151">    return resource.listAll();</text>
  <text x="410" y="136" class="code" fill="#374151">}</text>
  <text x="410" y="158" class="label">Agent sees: return type "Object"</text>

  <!-- Bottom: What the agent experiences -->
  <rect x="100" y="200" width="520" height="100" class="box" fill="#fefce8" stroke="#ca8a04"/>
  <text x="360" y="222" text-anchor="middle" font-size="13" font-weight="600" fill="#ca8a04">What the agent gets in the MCP tool schema</text>
  <text x="120" y="252" class="code" fill="#374151">{ "name": "listAll",</text>
  <text x="120" y="270" class="code" fill="#374151">  "parameters": [...],</text>
  <text x="120" y="288" class="code" fill="#dc2626">  "returns": "Object" }    ← no fields, no structure, opaque</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>
